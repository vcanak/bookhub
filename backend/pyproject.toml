[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-starter"
version = "0.1.0"
description = "Production-grade FastAPI starter with PostgreSQL, Redis, Celery, JWT auth, and full observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FastAPI Starter Contributors" }]
keywords = ["fastapi", "starter", "postgresql", "redis", "celery", "jwt"]

dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "gunicorn>=26.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.4",
    "redis>=6.4.0",
    "celery[redis]>=5.6.3",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "faker>=40.23.0",
    "ruff>=0.15.18",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC",
    "S",   # flake8-bandit
    "RUF",
]
ignore = [
    "S101",  # asserts allowed (tests)
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG", "PLR2004"]
"alembic/**/*.py" = ["E501", "F401"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: pure unit tests with no external services",
    "integration: tests requiring postgres/redis",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
