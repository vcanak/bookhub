{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapi-starter.fullname" . }}
  labels:
    {{- include "fastapi-starter.labels" . | nindent 4 }}
type: Opaque
data:
  # JWT signing key (env: SECRET_KEY). Must be >= 32 chars; strong in production.
  SECRET_KEY: {{ required "secrets.secretKey is required" .Values.secrets.secretKey | b64enc | quote }}
  # Database password (env: POSTGRES_PASSWORD).
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | b64enc | quote }}
  {{- if .Values.secrets.redisPassword }}
  # Optional Redis password (env: REDIS_PASSWORD).
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.firstSuperuserEmail }}
  FIRST_SUPERUSER_EMAIL: {{ .Values.secrets.firstSuperuserEmail | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.firstSuperuserPassword }}
  FIRST_SUPERUSER_PASSWORD: {{ .Values.secrets.firstSuperuserPassword | b64enc | quote }}
  {{- end }}
{{- end }}
