# Alembic configuration.
#
# The database URL is intentionally NOT set here. It is built at runtime in
# ``alembic/env.py`` from ``app.core.config.settings.SQLALCHEMY_DATABASE_URI``
# so there is a single source of truth for connection settings.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
# Produces e.g. ``20260621_1430_abcd1234_add_users.py``.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend to sys.path so ``app`` is importable when running alembic.
prepend_sys_path = .

# Use OS-native path separators in version locations.
version_path_separator = os

# Timezone for timestamps in generated migration filenames.
# Empty value uses the local server time.
timezone =

# Max length of the truncated "slug" derived from the revision message.
truncate_slug_length = 40

# sqlalchemy.url is deliberately omitted; see alembic/env.py.

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
