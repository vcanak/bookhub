apiVersion: v1
kind: Secret
metadata:
  name: fastapi-starter-secret
  namespace: fastapi-starter
  labels:
    app.kubernetes.io/name: fastapi-starter
    app.kubernetes.io/instance: fastapi-starter
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: fastapi-starter
# ===========================================================================
# CHANGE ME — DO NOT SHIP THESE VALUES TO PRODUCTION.
#
# These are placeholder credentials so the manifests apply out of the box for
# local/demo clusters. In any real environment you MUST source these from a
# proper secret manager and NEVER commit them to version control. Recommended
# options:
#   * External Secrets Operator   (https://external-secrets.io)
#   * Sealed Secrets              (https://sealed-secrets.netlify.app)
#   * HashiCorp Vault / Vault Agent Injector
#   * Cloud-native: AWS Secrets Manager, GCP Secret Manager, Azure Key Vault
#
# Notes on the keys below (case-sensitive, consumed by app/core/config.py):
#   * SECRET_KEY      — MUST be >= 32 chars AND a strong random value. With
#                       ENVIRONMENT=production the app REFUSES TO START if this
#                       is left at the insecure sentinel default. Generate one:
#                         python -c 'import secrets; print(secrets.token_urlsafe(48))'
#   * POSTGRES_USER   — also consumed by the Postgres StatefulSet (postgres.yaml).
#   * POSTGRES_PASSWORD — also consumed by the Postgres StatefulSet.
#
# stringData lets you write plaintext; Kubernetes base64-encodes it on apply.
# ===========================================================================
type: Opaque
stringData:
  # CHANGE ME: generate with `python -c 'import secrets; print(secrets.token_urlsafe(48))'`
  SECRET_KEY: "CHANGE_ME_generate_a_strong_random_secret_at_least_32_chars"
  # CHANGE ME: database credentials (shared with the Postgres StatefulSet).
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_use_a_strong_database_password"
